<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sts — live captions</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  .panel {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
    box-sizing: border-box;
  }

  #original-panel { background: #0b0b0f; border-bottom: 2px solid #222; }
  #translated-panel { background: #000; }

  .label {
    position: absolute;
    top: 0.6vh;
    left: 1.2vw;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
    z-index: 1;
  }

  .lines {
    height: 100%;
    box-sizing: border-box;
    padding: 4.5vh 3vw 1.5vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 0.4em;
  }

  /* All snippets of a panel run together as one flowing paragraph: each new
     snippet continues on the same line as the previous one instead of starting
     its own block. */
  .flow {
    font-size: clamp(1.4rem, 4vw, 3.2rem);
    line-height: 1.25;
  }

  .line {
    animation: fade-in 0.25s ease-out;
  }

  .line.old { opacity: 0.4; transition: opacity 0.6s ease; }

  #original-lines .line { color: #9cdcfe; }
  #translated-lines .line { color: #e8c07d; }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #indicators {
    flex: 0 0 auto;
    font-size: 0.75rem;
    color: #888;
    display: flex;
    align-items: center;
    gap: 1.2em;
  }

  #status, #stage {
    display: flex;
    align-items: center;
    gap: 0.45em;
  }

  #stage:empty { display: none; }

  #stage::before {
    content: '';
    width: 0.6em;
    height: 0.6em;
    border-radius: 50%;
    background: #e0b341;
    animation: pulse 1.2s ease-in-out infinite;
  }

  #stage.ready::before { background: #4cbb6c; animation: none; }

  @keyframes pulse {
    50% { opacity: 0.3; }
  }

  #status::before {
    content: '';
    width: 0.6em;
    height: 0.6em;
    border-radius: 50%;
    background: #d9534f;
  }

  #status.connected::before { background: #4cbb6c; }

  #verse-overlay {
    position: fixed;
    top: var(--header-h, 0px);
    left: 50%;
    z-index: 3;
    width: min(90vw, 60rem);
    box-sizing: border-box;
    padding: 2.2vh 3vw;
    background: rgba(10, 10, 12, 0.96);
    border-bottom: 3px solid #c9a24b;
    border-left: 1px solid #333;
    border-right: 1px solid #333;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    transform: translate(-50%, -105%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #verse-overlay.show { transform: translate(-50%, 0); }

  .verse-reference {
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 0.6em;
  }

  .verse-text {
    font-size: clamp(1.1rem, 2.6vw, 1.8rem);
    line-height: 1.4;
    margin-bottom: 0.5em;
  }

  #verse-ru { color: #9cdcfe; }
  #verse-en { color: #e8c07d; }

  /* Permanent header: part of the page layout (the caption panels take the
     remaining height), always fully visible, sitting above the verse overlay. */
  #header {
    flex: 0 0 auto;
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    padding: 0.5em 1.2vw;
    background: #111116;
    border-bottom: 1px solid #2a2a30;
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6em;
  }

  #controls button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 1em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1a1a1e;
    color: #ccc;
    cursor: pointer;
  }

  #controls button:hover { border-color: #777; }

  #controls input, #controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 0.7em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #111;
    color: #ccc;
  }

  #btn-save-voice:disabled { opacity: 0.4; cursor: default; }
  #btn-create-voice[hidden] { display: none; }
  #design-dialog {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6);
  }
  #design-dialog.show { display: flex; }
  #design-dialog .card {
    background: #16161c; border: 1px solid #333; border-radius: 10px;
    padding: 1.2rem 1.4rem; width: min(34rem, 92vw); max-height: 92vh; overflow-y: auto;
    color: #ddd; font-size: 0.95rem;
  }
  #design-dialog h3 { margin: 0 0 0.8rem; font-size: 1rem; }
  #design-dialog label { display: block; margin: 0.9rem 0 0.3rem; font-size: 0.8rem; color: #9a9aa5; }
  #design-dialog textarea, #design-dialog input[type=text] {
    width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; resize: vertical;
  }
  #design-dialog .row { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.5rem; }
  #design-dialog .row input { flex: 1; }
  #design-status { min-height: 1.3em; margin-top: 0.6rem; font-size: 0.85rem; color: #e0b341; }
  #design-status.error { color: #e08a8a; }
  #design-dialog .footer { display: flex; justify-content: flex-end; margin-top: 1rem; }
  #design-dialog button:disabled { opacity: 0.4; cursor: default; }
  #save-dialog {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6);
  }
  #save-dialog.show { display: flex; }
  #save-dialog form {
    background: #16161c; border: 1px solid #333; border-radius: 10px;
    padding: 1.2rem 1.4rem; width: min(22rem, 90vw); color: #ddd; font-size: 0.95rem;
  }
  #save-dialog h3 { margin: 0 0 0.8rem; font-size: 1rem; }
  #save-dialog input { width: 100%; box-sizing: border-box; padding: 0.5rem; font-size: 1rem; }
  #save-dialog .note { min-height: 1.2em; margin: 0.5rem 0; color: #e0b341; font-size: 0.8rem; }
  #save-dialog .actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.4rem; }

  #btn-toggle.is-active { background: #1f4d2b; border-color: #3a9350; color: #d7ffdf; }
  #btn-voice.is-active { background: #1f3d4d; border-color: #3a90c9; color: #d7f3ff; }
  #btn-train.is-active { background: #4d3a1f; border-color: #c9a24b; color: #ffe9bf; }
  #btn-reset, #btn-delete-voice { color: #e08a8a; }
  #btn-delete-voice[hidden] { display: none; }
</style>
</head>
<body>
  <div id="app">
  <div id="header">
    <div id="controls">
      <button id="btn-toggle">Stop</button>
      <button id="btn-voice">🔇 Voice off</button>
      <select id="voice-select" title="Voice: built-in (Default) or a saved trained voice (Custom)"></select>
      <button id="btn-create-voice" hidden title="Design a new voice from a text description (Qwen3 backend)">Create Voice</button>
      <button id="btn-train">Train voice</button>
      <button id="btn-save-voice" disabled title="Save the trained voice to the library">Save Voice</button>
      <button id="btn-delete-voice" hidden title="Delete the selected saved voice">Delete</button>
      <button id="btn-reset">Reset</button>
    </div>
    <div id="indicators">
      <div id="stage"></div>
      <div id="status" class="disconnected">Not connected</div>
    </div>
  </div>
    <div class="panel" id="original-panel">
      <span class="label">Original</span>
      <div class="lines" id="original-lines"></div>
    </div>
    <div class="panel" id="translated-panel">
      <span class="label">Translated</span>
      <div class="lines" id="translated-lines"></div>
    </div>
  </div>

  <div id="verse-overlay">
    <div class="verse-reference" id="verse-reference"></div>
    <div class="verse-text" id="verse-ru"></div>
    <div class="verse-text" id="verse-en"></div>
  </div>


<div id="design-dialog">
    <div class="card">
      <h3>Create voice</h3>
      <label for="design-prompt">Describe the voice</label>
      <textarea id="design-prompt" rows="3">A calm, deep male voice with a warm, natural American accent, speaking slowly and gently like a preacher giving a sermon.</textarea>
      <div class="row"><button type="button" id="design-generate">Generate</button></div>

      <label for="design-sample">Sample text to try the voice on</label>
      <textarea id="design-sample" rows="3">The Lord is my shepherd; I shall not want. He makes me lie down in green pastures; He leads me beside still waters.</textarea>
      <div class="row"><button type="button" id="design-play" disabled>Play sample</button></div>

      <div id="design-status"></div>

      <label for="design-name">Voice name</label>
      <div class="row">
        <input id="design-name" type="text" placeholder="e.g. Calm preacher" autocomplete="off" />
        <button type="button" id="design-save" disabled>Save</button>
      </div>
      <div class="footer"><button type="button" id="design-close">Close</button></div>
    </div>
  </div>

  <div id="save-dialog">
    <form id="save-form">
      <h3>Save trained voice</h3>
      <input id="save-name" type="text" placeholder="Voice name" autocomplete="off" required />
      <div class="note" id="save-note"></div>
      <div class="actions">
        <button type="button" id="save-cancel">Cancel</button>
        <button type="submit" id="save-confirm">Save</button>
      </div>
    </form>
  </div>

<script>
  function addLine(containerId, text) {
    const container = document.getElementById(containerId);
    let flow = container.querySelector('.flow');
    if (!flow) {
      flow = document.createElement('p');
      flow.className = 'flow';
      flow.style.margin = '0';
      container.appendChild(flow);
    }
    const snippet = document.createElement('span');
    snippet.className = 'line';
    snippet.textContent = text + ' ';  // the space keeps consecutive snippets apart on one line
    for (const previous of flow.children) previous.classList.add('old');
    flow.appendChild(snippet);

    // Drop the oldest snippets once the text no longer fits, so the DOM (and
    // the visible page) never grows without bound during a long stream.
    // (The container is bottom-aligned, so overflow extends upward where
    // scrollHeight can't see it; compare the text block's own height instead.)
    const style = getComputedStyle(container);
    const available = container.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    while (flow.children.length > 1 && flow.offsetHeight > available) {
      flow.removeChild(flow.firstChild);
    }
  }

  // The verse overlay hangs from just below the header, whatever its height
  // (it wraps to more rows on narrow screens).
  const headerEl = document.getElementById('header');
  const syncHeaderHeight = () =>
    document.documentElement.style.setProperty('--header-h', `${headerEl.offsetHeight}px`);
  new ResizeObserver(syncHeaderHeight).observe(headerEl);
  syncHeaderHeight();

  const VERSE_DISPLAY_MS = 25000;
  let verseHideTimer = null;

  function showVerse(msg) {
    document.getElementById('verse-reference').textContent = msg.reference;
    document.getElementById('verse-ru').textContent = msg.ru_text || '';
    document.getElementById('verse-en').textContent = msg.en_text || '';

    const overlay = document.getElementById('verse-overlay');
    overlay.classList.add('show');

    clearTimeout(verseHideTimer);
    verseHideTimer = setTimeout(() => overlay.classList.remove('show'), VERSE_DISPLAY_MS);
  }

  function clearCaptions() {
    document.getElementById('original-lines').innerHTML = '';
    document.getElementById('translated-lines').innerHTML = '';
    document.getElementById('verse-overlay').classList.remove('show');
    clearTimeout(verseHideTimer);
  }

  const toggleBtn = document.getElementById('btn-toggle');
  const voiceBtn = document.getElementById('btn-voice');
  const trainBtn = document.getElementById('btn-train');
  const resetBtn = document.getElementById('btn-reset');
  const saveBtn = document.getElementById('btn-save-voice');
  const createBtn = document.getElementById('btn-create-voice');
  const designDialog = document.getElementById('design-dialog');
  const designPrompt = document.getElementById('design-prompt');
  const designSample = document.getElementById('design-sample');
  const designName = document.getElementById('design-name');
  const designStatus = document.getElementById('design-status');
  const designGenerate = document.getElementById('design-generate');
  const designPlay = document.getElementById('design-play');
  const designSave = document.getElementById('design-save');
  const saveDialog = document.getElementById('save-dialog');
  const saveName = document.getElementById('save-name');
  const saveNote = document.getElementById('save-note');
  let libraryNames = [];
  const voiceSelect = document.getElementById('voice-select');
  const deleteBtn = document.getElementById('btn-delete-voice');
  let defaultVoices = [];   // built-in voice names (the "Default" group)
  let savedVoices = [];     // [{id, name}] from the voice library (the "Custom" group)
  let lastStatus = {
    active: true, voice_enabled: false, training: false,
    training_seconds: 0, training_target_seconds: 0, cloned: false, active_speaker_id: null,
  };

  // One dropdown, two groups. Option values are tagged so the two kinds can't
  // collide: "default:<name>", "saved:<id>", or "unsaved" for a just-trained
  // voice that isn't in the library yet.
  function currentVoiceValue() {
    if (lastStatus.active_speaker_id) return `saved:${lastStatus.active_speaker_id}`;
    if (lastStatus.cloned) return 'unsaved';
    return lastStatus.default_voice ? `default:${lastStatus.default_voice}` : '';
  }

  function renderVoiceSelect() {
    const unsaved = !lastStatus.active_speaker_id && lastStatus.cloned;
    // Rebuild only when the list itself changes, so a status update (they arrive
    // constantly during training) can't snap an open dropdown shut.
    const signature = JSON.stringify([defaultVoices, savedVoices, unsaved ? lastStatus.can_save : null]);
    if (voiceSelect.dataset.signature !== signature) {
      voiceSelect.dataset.signature = signature;
      voiceSelect.innerHTML = '';
      const addGroup = (label, options) => {
        if (!options.length) return;
        const group = document.createElement('optgroup');
        group.label = label;
        for (const { value, text } of options) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = text;
          group.appendChild(option);
        }
        voiceSelect.appendChild(group);
      };
      addGroup('Default', defaultVoices.map((name) => ({ value: `default:${name}`, text: name })));
      const custom = savedVoices.map((voice) => ({ value: `saved:${voice.id}`, text: voice.name }));
      if (unsaved) {
        custom.unshift({ value: 'unsaved', text: lastStatus.can_save ? 'New voice (unsaved)' : 'Cloned voice (this session)' });
      }
      addGroup('Custom', custom);
    }
    voiceSelect.value = currentVoiceValue();
    syncDeleteButton();
  }

  function applyStatus(status) {
    lastStatus = status;

    toggleBtn.textContent = status.active ? 'Stop' : 'Start';
    toggleBtn.classList.toggle('is-active', status.active);

    voiceBtn.textContent = status.voice_enabled ? '🔊 Voice on' : '🔇 Voice off';
    voiceBtn.classList.toggle('is-active', status.voice_enabled);

    if (status.training) {
      trainBtn.textContent = `Stop training (${status.training_seconds}s / ${status.training_target_seconds}s)`;
    } else {
      trainBtn.textContent = status.cloned ? 'Train voice (cloned ✓)' : 'Train voice';
    }
    trainBtn.classList.toggle('is-active', status.training);
    saveBtn.disabled = !status.can_save || status.training;
    createBtn.hidden = !status.can_design;
    if (!status.can_save) closeSaveDialog();

    if (status.voice_groups) defaultVoices = Object.values(status.voice_groups).flat();
    renderVoiceSelect();
  }

  function applyLibrary(msg) {
    libraryNames = msg.speakers.map((speaker) => speaker.name);
    savedVoices = msg.speakers;
    renderVoiceSelect();
  }

  let ws = null;
  function send(action, extra = {}) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action, ...extra }));
    }
  }

  toggleBtn.addEventListener('click', () => send(lastStatus.active ? 'stop' : 'start'));
  voiceBtn.addEventListener('click', () => send(lastStatus.voice_enabled ? 'voice_off' : 'voice_on'));
  trainBtn.addEventListener('click', () => {
    if (lastStatus.training) {
      send('train_stop');
    } else {
      send('train_start');
    }
  });
  resetBtn.addEventListener('click', () => send('reset'));
  // -- Create Voice (Qwen3 voice design) ------------------------------------
  function applyDesign(msg) {
    const busy = msg.state === 'busy';
    designStatus.textContent = msg.message || '';
    designStatus.classList.toggle('error', msg.state === 'error');
    designGenerate.disabled = busy;
    designPlay.disabled = busy || !msg.has_voice;
    designSave.disabled = busy || !msg.has_voice;
    if (msg.state === 'saved') {
      designDialog.classList.remove('show');
    }
  }

  createBtn.addEventListener('click', () => {
    designName.value = '';
    designDialog.classList.add('show');
    designPrompt.focus();
  });
  designGenerate.addEventListener('click', () => {
    if (designPrompt.value.trim()) send('design_generate', { prompt: designPrompt.value });
  });
  designPlay.addEventListener('click', () => {
    if (designSample.value.trim()) send('design_play', { text: designSample.value });
  });
  designSave.addEventListener('click', () => {
    const name = designName.value.trim();
    if (!name) { designName.focus(); return; }
    const exists = libraryNames.some((existing) => existing.trim().toLowerCase() === name.toLowerCase());
    if (exists && !confirm(`A voice named "${name}" already exists. Replace it?`)) return;
    send('design_save', { name });
  });
  document.getElementById('design-close').addEventListener('click', () => {
    designDialog.classList.remove('show');
    send('design_close');
  });

  function openSaveDialog() {
    saveName.value = '';
    saveNote.textContent = '';
    saveDialog.classList.add('show');
    saveName.focus();
  }

  function closeSaveDialog() {
    saveDialog.classList.remove('show');
  }

  saveName.addEventListener('input', () => {
    const name = saveName.value.trim().toLowerCase();
    const exists = libraryNames.some((existing) => existing.trim().toLowerCase() === name);
    saveNote.textContent = exists ? 'A voice with this name already exists - saving will replace it.' : '';
  });
  saveBtn.addEventListener('click', openSaveDialog);
  document.getElementById('save-cancel').addEventListener('click', closeSaveDialog);
  document.getElementById('save-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const name = saveName.value.trim();
    if (!name) return;
    send('save_voice', { name });
    closeSaveDialog();
  });

  function syncDeleteButton() {
    // Only offered while a saved (Custom) voice is selected.
    deleteBtn.hidden = !voiceSelect.value.startsWith('saved:');
  }
  deleteBtn.addEventListener('click', () => {
    if (!voiceSelect.value.startsWith('saved:')) return;
    const id = voiceSelect.value.slice('saved:'.length);
    const name = voiceSelect.options[voiceSelect.selectedIndex].textContent;
    if (confirm(`Delete the voice "${name}"? This can't be undone.`)) send('delete_voice', { speaker_id: id });
  });
  voiceSelect.addEventListener('change', () => {
    const value = voiceSelect.value;
    if (value.startsWith('default:')) send('default_voice', { voice: value.slice('default:'.length) });
    else if (value.startsWith('saved:')) send('select_speaker', { speaker_id: value.slice('saved:'.length) });
    else renderVoiceSelect();  // "unsaved" is already active; nothing to switch to
    syncDeleteButton();
  });

  function connect() {
    const status = document.getElementById('status');
    const stage = document.getElementById('stage');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      // The server replays recent captions on connect, so start clean to
      // avoid duplicates after a reconnect.
      clearCaptions();
      status.textContent = 'Connected';
      status.className = 'connected';
    };
    ws.onerror = () => ws.close();
    ws.onclose = () => {
      status.textContent = 'Not connected';
      status.className = 'disconnected';
      stage.textContent = '';
      setTimeout(connect, 1000);
    };
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'original') addLine('original-lines', msg.text);
      else if (msg.type === 'translated') addLine('translated-lines', msg.text);
      else if (msg.type === 'verse') showVerse(msg);
      else if (msg.type === 'reset') clearCaptions();
      else if (msg.type === 'stage') {
        stage.textContent = msg.text;
        stage.className = msg.ready ? 'ready' : '';
      }
      else if (msg.type === 'status') applyStatus(msg);
      else if (msg.type === 'library') applyLibrary(msg);
      else if (msg.type === 'design') applyDesign(msg);
    };
  }

  connect();
</script>
</body>
</html>

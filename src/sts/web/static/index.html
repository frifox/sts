<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sts — live captions</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    /* iPad/iPhone Safari: 100vh is the height with its toolbars hidden, so
       the bottom of the page ended up behind them; dvh is the height
       actually visible. (Browsers without dvh keep the line above.) */
    height: 100dvh;
    width: 100vw;
  }

  .panel {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
    box-sizing: border-box;
  }

  #original-panel { background: #0b0b0f; border-bottom: 2px solid #222; }
  #translated-panel { background: #000; }
  #portrait-panel { background: #000; }
  #original-panel[hidden], #translated-panel[hidden], #portrait-panel[hidden] { display: none; }

  #idle-message {
    display: none;
    flex: 1 1 auto;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #3a3a40;
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #idle-message.show { display: flex; }

  .lines {
    height: 100%;
    box-sizing: border-box;
    padding: 4.5vh 3vw 1.5vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 0.4em;
  }

  /* All snippets of a panel run together as one flowing paragraph: each new
     snippet continues on the same line as the previous one instead of starting
     its own block. */
  .flow {
    font-size: clamp(1.4rem, 4vw, 3.0rem);
    line-height: 1.25;
  }

  .line {
    animation: fade-in 0.25s ease-out;
  }

  /* In each column the newest line stays bright and older ones are faded.
     For the original captions that means the newest final sentence; the
     text that isn't final yet (.recent) is faded too, in its own paragraph
     below them (the last row in portrait), and doesn't count as a line. */
  .line.old { opacity: 0.4; transition: opacity 0.6s ease; }

  #original-lines .line { color: #9cdcfe; }
  #translated-lines .line { color: #e8c07d; }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Portrait render mode: original/translated side by side, one row per
     snippet pair instead of one flowing paragraph per panel. #portrait-lines
     is a plain `.lines` flex wrapper (clips and bottom-aligns, same as the
     landscape panels); the grid itself is its one auto-height flex child, so
     its own offsetHeight reflects the *true* content height for pruning -
     the grid can't measure that itself once its rows overflow upward past
     `align-content: end` (see prunePortraitRows()'s comment). Grid rows
     auto-size to their tallest cell and stretch every cell in the row to
     match (the default `align-items: stretch`), so a short snippet on one
     side still occupies the same row height as a longer one on the other. */
  .portrait-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 3vw;
    row-gap: 0.6em;
  }

  .portrait-cell {
    font-size: clamp(1.4rem, 4vw, 3.0rem);  /* same as .flow (landscape), so text reads the same size in both modes */
    line-height: 1.25;
    overflow-wrap: break-word;
  }

  #portrait-lines .original { color: #9cdcfe; }
  #portrait-lines .translated { color: #e8c07d; }

  /* The caption text that isn't final yet: smaller than the final text
     around it, and the same size in both layouts - rem, not em, so it
     doesn't scale with its container (the landscape paragraph's font is
     already large; em would double it). After .portrait-cell so it wins
     there too (same specificity - order decides). */
  /* Faded like older lines (.line.old). No fade-in: that runs to full
     opacity, so it would flash bright every time the live text appears. */
  .recent { font-size: 2rem; line-height: 1.25; opacity: 0.4; animation: none; }

  /* Portrait mode has no separate original/translated panels to hide (both
     columns live in one shared panel) - Caption/Translate turning off is
     applied to just that column instead: its own cells, verse banner
     and recall chip, and the grid collapses to a single column so the
     remaining side takes the full width, same as when a whole landscape
     panel is hidden and the other one gets all the space. */
  #portrait-panel.hide-original #verse-banner-portrait-ru,
  #portrait-panel.hide-original #verse-chip-portrait-ru,
  #portrait-panel.hide-original .portrait-grid .original,
  #portrait-panel.hide-translated #verse-banner-portrait-en,
  #portrait-panel.hide-translated #verse-chip-portrait-en,
  #portrait-panel.hide-translated .portrait-grid .translated {
    display: none;
  }

  #portrait-panel.hide-original .portrait-grid,
  #portrait-panel.hide-translated .portrait-grid {
    grid-template-columns: 1fr;
  }

  #indicators {
    flex: 0 0 auto;
    font-size: 0.75rem;
    color: #888;
    display: flex;
    align-items: center;
    gap: 1.2em;
  }

  #rtf-indicators {
    display: flex;
    align-items: center;
    gap: 0.9em;
    font-variant-numeric: tabular-nums;
  }

  .rtf-item b { color: #4cbb6c; font-weight: 600; }
  .rtf-item.slow b { color: #e0864c; }
  .rtf-item.unknown b { color: #888; }

  #volume-control {
    display: flex;
    align-items: center;
    gap: 0.5em;
    cursor: default;
  }
  #volume-slider { width: 7.5em; accent-color: #7a8aa0; cursor: pointer; }
  #volume-value { min-width: 3em; font-variant-numeric: tabular-nums; }

  #stage {
    display: flex;
    align-items: center;
    gap: 0.45em;
  }

  #stage::before {
    content: '';
    width: 0.6em;
    height: 0.6em;
    border-radius: 50%;
    background: #e0b341;
    animation: pulse 1.2s ease-in-out infinite;
  }

  #stage.ready::before { background: #4cbb6c; animation: none; }

  @keyframes pulse {
    50% { opacity: 0.3; }
  }

  /* A detected Bible reference's text, attached to the top of each panel it
     belongs in (original/RU, translated/EN) rather than one box overlaying
     the whole viewport - it slides down from the top of just that panel, on
     top of whatever's currently scrolled up there, so the newest (bottom-
     aligned) caption lines stay clear of it as much as possible. */
  .verse-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    box-sizing: border-box;
    padding: 1.2vh 1.5vw;
    background: rgba(10, 10, 12, 0.96);
    border-bottom: 3px solid #c9a24b;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    transform: translateY(-105%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .verse-banner.show { transform: translateY(0); }

  /* Portrait mode: one banner per column, side by side instead of full width. */
  .verse-banner.verse-banner-left { right: 50%; }
  .verse-banner.verse-banner-right { left: 50%; }

  .verse-banner .verse-reference {
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 0.4em;
  }

  .verse-banner .verse-text {
    font-size: clamp(0.9rem, 2vw, 1.4rem);
    line-height: 1.35;
  }

  .verse-banner.ru .verse-text { color: #9cdcfe; }
  .verse-banner.en .verse-text { color: #e8c07d; }

  /* Small recall button for the most recently detected verse, so it can be
     brought back after its banner auto-dismisses. Sits in the top corner of
     that panel; hidden until a verse has been detected at least once. */
  .verse-chip {
    display: none;
    position: absolute;
    top: 0.8vh;
    left: 1.2vw;
    z-index: 1;
    box-sizing: border-box;
    max-width: calc(100% - 2.4vw);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    padding: 0.3em 0.8em;
    border-radius: 999px;
    border: 1px solid #c9a24b;
    background: rgba(20, 20, 24, 0.85);
    color: #c9a24b;
    cursor: pointer;
  }

  /* Countdown to when the still-open caption text gets finalized, shown once
     nothing new has been recognized for a few seconds (see
     Pipeline._publish_finalize_countdown). Bottom-right of the caption
     panel - in portrait, of the original (left) column, unless that's the
     only column. */
  .finalize-countdown {
    display: none;
    position: absolute;
    bottom: 0.8vh;
    right: 1.2vw;
    z-index: 1;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    padding: 0.3em 0.8em;
    border-radius: 999px;
    border: 1px solid #3a4a5a;
    background: rgba(20, 20, 24, 0.85);
    color: #9cdcfe;
    pointer-events: none;
  }
  .finalize-countdown.show { display: block; }
  body.hide-unfinished .finalize-countdown.show { display: none; }  /* nothing on screen for it to finalize */
  #portrait-panel .finalize-countdown { right: calc(50% + 1.5vw); }
  #portrait-panel.hide-translated .finalize-countdown { right: 1.2vw; }
  #portrait-panel.hide-original .finalize-countdown { display: none; }

  .verse-chip:hover { background: rgba(201, 162, 75, 0.18); }
  .verse-chip.show { display: inline-block; }
  .verse-chip.right { left: auto; right: 1.2vw; }

  /* Permanent header: part of the page layout (the caption panels take the
     remaining height), always fully visible, sitting above the verse overlay. */
  #header {
    flex: 0 0 auto;
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    padding: 0.5em 1.2vw;
    background: #111116;
    border-bottom: 1px solid #2a2a30;
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6em;
  }

  /* Live input/output level meters: 10 bars each, tallest on the right,
     colored by position (not by whether the current level reaches them) -
     bars 1-5 read as "quiet", 6-10 as "good", same idea as a hardware VU
     meter's fixed color zones. How many are actually lit is the only thing
     that changes as the level moves. */
  #volume-meter, #output-meter {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 1.5em;
    padding: 0 0.2em;
    cursor: pointer;
  }
  .volume-bar {
    width: 0.3em;
    background: #2a2a30;
    border-radius: 1px;
    transition: background-color 0.08s linear;
  }
  .volume-bar:nth-child(1) { height: 22%; }
  .volume-bar:nth-child(2) { height: 32%; }
  .volume-bar:nth-child(3) { height: 42%; }
  .volume-bar:nth-child(4) { height: 52%; }
  .volume-bar:nth-child(5) { height: 62%; }
  .volume-bar:nth-child(6) { height: 72%; }
  .volume-bar:nth-child(7) { height: 82%; }
  .volume-bar:nth-child(8) { height: 91%; }
  .volume-bar:nth-child(9) { height: 100%; }
  .volume-bar:nth-child(10) { height: 100%; }
  /* Small icon on a meter's top-left edge: the browser's own mic is the
     input / the voice is streaming to this browser. A zero-width flex item
     (moved to the front with `order`, but last in the markup so the bars'
     nth-child heights stay put) that the icon hangs off - it can't be
     positioned against the meter itself, which is `position: static` on
     phones so the dropdowns can span the controls row. */
  .meter-badge {
    display: none;
    order: -1;
    position: relative;
    align-self: flex-start;
    width: 0;
    margin-right: -2px;  /* cancel the meter's gap for this zero-width item */
  }
  .meter-badge.show { display: block; }
  .meter-badge svg {
    position: absolute;
    top: 0;  /* the top of the meter - where the tallest (last) bar's top is */
    left: 0;  /* the badge sits exactly where the first bar starts */
    width: 0.8em;
    height: 0.8em;
    fill: #9cdcfe;
    pointer-events: none;
  }
  #output-meter .meter-badge svg { width: 0.65em; height: 0.65em; }
  .volume-bar.lit-quiet { background: #c9a24b; }
  .volume-bar.lit-good { background: #4cbb6c; }

  #controls button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 1em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1a1a1e;
    color: #ccc;
    cursor: pointer;
  }

  #controls button:hover { border-color: #777; }

  #controls input, #controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 0.7em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #111;
    color: #ccc;
  }

  #btn-save-voice:disabled { opacity: 0.4; cursor: default; }
  #btn-create-voice[hidden] { display: none; }

  .engine { position: relative; display: flex; }
  #controls .engine-toggle.is-active { background: #1f4d2b; border-color: #3a9350; color: #d7ffdf; }
  /* Disabled: starting up, mid ASR-engine switch, disconnected, or (for
     Translate/Voice) an upstream stage they'd have nothing to work with is
     off - toggling wouldn't do anything, so don't invite the click. */
  #controls .engine-toggle:disabled { opacity: 0.4; cursor: default; }
  .engine-dropdown {
    display: none;
    position: absolute;
    /* Flush against the button row (no margin-top gap): a gap there isn't
       covered by .engine's hover box, so crossing it on the way down from
       the caret briefly leaves .engine and fires mouseleave early, closing
       the dropdown before the pointer arrives. */
    top: 100%;
    left: 0;
    min-width: 17rem;
    background: #16161c;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.9rem 1rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    z-index: 20;
    font-size: 0.85rem;
  }
  .engine-dropdown.show { display: block; }
  .engine-info { color: #9a9aa5; margin-bottom: 0.7rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .engine-info b { color: #ddd; font-weight: 600; }
  .engine-dropdown label { display: block; margin: 0.6rem 0 0.3rem; color: #9a9aa5; }
  .engine-dropdown select { width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
  .engine-dropdown .dropdown-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
  .engine-dropdown .mic-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.7rem; }
  .engine-dropdown .mic-row button { flex: 0 0 auto; }
  #mic-status { font-size: 0.78rem; color: #9a9aa5; }
  #mic-status.error { color: #e08a8a; }
  #btn-browser-mic.is-active, #stream-toggle.is-active { background: #1f4d2b; border-color: #3a9350; color: #d7ffdf; }
  /* Landscape / Portrait: two buttons side by side, the current one lit. */
  .engine-dropdown .render-mode { display: flex; gap: 0.5rem; }
  .engine-dropdown .render-mode button { flex: 1 1 0; }
  /* #controls, like the other "on" rules: it has to outrank the general
     #controls button rule, or its background wins and the button never turns green. */
  #controls .render-mode button.is-active { background: #1f4d2b; border-color: #3a9350; color: #d7ffdf; }
  /* Dark styling for the modal dialogs' own buttons and fields (the header's are styled via #controls). */
  #design-dialog button, #save-dialog button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 1em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1a1a1e;
    color: #ccc;
    cursor: pointer;
  }
  #design-dialog button:hover:not(:disabled), #save-dialog button:hover:not(:disabled) { border-color: #777; }
  #design-dialog textarea, #design-dialog input[type=text], #save-dialog input {
    border-radius: 6px;
    border: 1px solid #444;
    background: #111;
    color: #ddd;
  }

  #design-dialog {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6);
  }
  #design-dialog.show { display: flex; }
  #design-dialog .card {
    background: #16161c; border: 1px solid #333; border-radius: 10px;
    padding: 1.2rem 1.4rem; width: min(34rem, 92vw); max-height: 92vh; overflow-y: auto;
    color: #ddd; font-size: 0.95rem;
  }
  #design-dialog h3 { margin: 0 0 0.8rem; font-size: 1rem; }
  #design-dialog label { display: block; margin: 0.9rem 0 0.3rem; font-size: 0.8rem; color: #9a9aa5; }
  #design-dialog textarea, #design-dialog input[type=text] {
    width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; resize: vertical;
  }
  #design-dialog .row { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.5rem; }
  #design-dialog .row input { flex: 1; }
  #design-status { min-height: 1.3em; margin-top: 0.6rem; font-size: 0.85rem; color: #e0b341; }
  #design-status.error { color: #e08a8a; }
  #design-dialog .footer { display: flex; justify-content: flex-end; margin-top: 1rem; }
  #design-dialog button:disabled { opacity: 0.4; cursor: default; }
  #save-dialog {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6);
  }
  #save-dialog.show { display: flex; }
  #save-dialog form {
    background: #16161c; border: 1px solid #333; border-radius: 10px;
    padding: 1.2rem 1.4rem; width: min(22rem, 90vw); color: #ddd; font-size: 0.95rem;
  }
  #save-dialog h3 { margin: 0 0 0.8rem; font-size: 1rem; }
  #save-dialog input { width: 100%; box-sizing: border-box; padding: 0.5rem; font-size: 1rem; }
  #save-dialog .note { min-height: 1.2em; margin: 0.5rem 0; color: #e0b341; font-size: 0.8rem; }
  #save-dialog .actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.4rem; }

  #btn-train.is-active { background: #4d3a1f; border-color: #c9a24b; color: #ffe9bf; }
  #btn-reset, #btn-delete-voice { color: #e08a8a; }
  #btn-delete-voice[hidden] { display: none; }

  /* Phones: the header splits into two rows - the controls on the first,
     the RTF indicators and status on the second - instead of squeezing
     both sides onto one line. Tighter button padding so the controls fit
     a phone's width on one row. Last in the sheet so it overrides the
     #controls button rule above (same specificity). */
  @media (max-width: 700px) {
    #header {
      flex-direction: column;
      align-items: stretch;
      gap: 0.4em;
      padding: 0.4em 8px;
    }
    #controls { gap: 0.4em; }
    #controls button { padding: 0.45em 0.7em; }
    #indicators { justify-content: space-between; flex-wrap: wrap; gap: 0.4em 1em; }

    /* Dropdowns anchor to the whole controls row instead of their own
       button, spanning its full width, so one opened from a button near
       the right edge can't run off the screen. */
    #controls { position: relative; }
    .engine, #volume-meter, #output-meter { position: static; }
    .engine-dropdown {
      left: 0;
      right: 0;
      min-width: 0;
      max-height: 70vh;
      overflow-y: auto;
    }
  }
</style>
</head>
<body>
  <div id="app">
  <div id="header">
    <div id="controls">
      <div id="volume-meter" title="Input level (whichever source is currently selected)">
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <span class="volume-bar"></span>
        <div class="engine-dropdown" id="dropdown-input">
          <label for="cfg-input">Input device (microphone / line in)</label>
          <select id="cfg-input"></select>
          <div class="mic-row">
            <button type="button" id="btn-browser-mic" title="Stream this browser's own microphone in as the input, instead of the server's sound card">🎤 Use this browser's mic</button>
          </div>
          <div id="mic-status"></div>
        </div>
        <span class="meter-badge" id="mic-badge" title="Input is this browser's microphone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V5a4 4 0 0 0-8 0v6a4 4 0 0 0 4 4zm7-4a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.08A7 7 0 0 0 19 11z"/></svg></span>
      </div>
      <div class="engine" id="engine-asr">
        <button class="engine-toggle" id="btn-asr-toggle">Caption</button>
        <div class="engine-dropdown" id="dropdown-asr">
          <div class="engine-info">
            <div>Model: <b id="asr-info-model">–</b></div>
            <div>Device: <b id="asr-info-device">–</b></div>
            <div>Input: <b id="asr-info-source">–</b></div>
          </div>
          <label id="unfinished-label">Unfinished text</label>
          <div class="render-mode" role="group" aria-labelledby="unfinished-label">
            <button type="button" data-unfinished="show" title="Show the caption text that isn't final yet, faded, below the final sentences">Show</button>
            <button type="button" data-unfinished="hide" title="Show only final sentences">Hide</button>
          </div>
        </div>
      </div>
      <div class="engine" id="engine-translate">
        <button class="engine-toggle" id="btn-translate-toggle">Translate</button>
        <div class="engine-dropdown" id="dropdown-translate">
          <div class="engine-info">
            <div>Model: <b id="translate-info-model">–</b></div>
            <div>Device: <b id="translate-info-device">–</b></div>
          </div>
          <label id="render-mode-label">Render</label>
          <div class="render-mode" role="group" aria-labelledby="render-mode-label">
            <button type="button" data-mode="landscape" title="Original and translated stacked, each its own flowing paragraph">Landscape</button>
            <button type="button" data-mode="portrait" title="Side-by-side columns, each sentence its own row so both languages line up">Portrait</button>
          </div>
        </div>
      </div>
      <div class="engine" id="engine-tts">
        <button class="engine-toggle" id="btn-tts-toggle">Voice</button>
        <div class="engine-dropdown" id="dropdown-tts">
          <div class="engine-info">
            <div>Model: <b id="tts-info-model">–</b></div>
            <div>Device: <b id="tts-info-device">–</b></div>
          </div>
          <label for="voice-select">Voice</label>
          <select id="voice-select" title="Voice: built-in (Default) or a saved trained voice (Custom)"></select>
          <div class="dropdown-actions">

<script>
  // How much scrolled-off history is kept around (as a multiple of the
  // container's own visible height) before the oldest snippets/rows are
  // actually dropped from the DOM. Only the bottom `1x` is ever visible
  // (clipped by the container's `overflow: hidden`, still bottom-aligned/
  // "scrolled up" as new text arrives) - the rest just sits there unseen,
  // so a page reload or re-render of history isn't limited to only what's
  // currently on screen.
  const HISTORY_RETENTION = 2;

  // Per-stage: true while that stage's engine is off (Caption -> asr,
  // Translate -> translate, Voice -> voice), or for all three while the
  // "System Idle" state is showing. An indicator whose stage is off reads
  // "–" and ignores any reading still in flight, rather than leaving the
  // last number up as if it were current - e.g. an engine switched off
  // mid-speech. See updatePanelVisibility().
  const rtfOff = { asr: false, translate: false, voice: false };
  const RTF_ELEMENT_IDS = { asr: 'rtf-asr', translate: 'rtf-translate', voice: 'rtf-voice' };

  // In each column - final originals and translations alike - the newest
  // line stays bright and a new one dims the rest. (The live, not-yet-final
  // original text isn't a line here: it's kept apart and never dims or
  // counts.) Every message carries a batch id (`batch`, currently the
  // sentence's own number); a line joins the still-highlighted batch when
  // it has the same id as the previous one in its column, and only a new id
  // starts a fresh batch and dims the previous one. The id, not timing, is
  // what decides it: a translation can lag its original by several seconds
  // (translation and TTS share one GPU lock on Apple Silicon, so a slow TTS
  // holds it up).
  //
  // Messages without an id (an older server) fall back to a time window:
  // anything within BATCH_GAP_MS of the previous one joins its batch.
  const BATCH_GAP_MS = 2000;
  const lastAddTime = {};
  const lastBatchId = {};

  function markOldIfNewBatch(key, elements, { forceNewBatch = false, batch } = {}) {
    const now = Date.now();
    let startsNewBatch;
    if (forceNewBatch) startsNewBatch = true;
    else if (batch !== undefined) startsNewBatch = batch !== lastBatchId[key];
    else startsNewBatch = now - (lastAddTime[key] || 0) > BATCH_GAP_MS;
    if (startsNewBatch) {
      for (const el of elements) el.classList.add('old');
    }
    lastAddTime[key] = now;
    lastBatchId[key] = forceNewBatch ? undefined : batch;
  }

  function flowOf(containerId) {
    const container = document.getElementById(containerId);
    let flow = container.querySelector('.flow');
    if (!flow) {
      flow = document.createElement('p');
      flow.className = 'flow';
      flow.style.margin = '0';
      // Above the live caption's own paragraph, if that's already there.
      container.insertBefore(flow, container.querySelector(':scope > .recent'));
    }
    return flow;
  }

  function addLine(containerId, text, opts, seq) {
    const container = document.getElementById(containerId);
    const flow = flowOf(containerId);
    const snippet = document.createElement('span');
    snippet.className = 'line';
    snippet.textContent = text + ' ';  // the space keeps consecutive snippets apart on one line
    snippet.seq = seq;  // kept so a switch to portrait can pair originals with translations exactly
    markOldIfNewBatch(containerId, flow.children, opts);  // the live caption isn't in `flow`
    flow.appendChild(snippet);

    // Drop the oldest snippets once even the retained (not just visible)
    // history no longer fits, so the DOM (and the visible page) never grows
    // without bound during a long stream. (The container is bottom-aligned,
    // so overflow extends upward where scrollHeight can't see it; compare
    // the text block's own height instead.)
    const style = getComputedStyle(container);
    const live = container.querySelector(':scope > .recent');  // the live caption's paragraph takes room too
    const available = container.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom)
      - (live ? live.offsetHeight : 0);
    while (flow.children.length > 1 && flow.offsetHeight > available * HISTORY_RETENTION) {
      flow.removeChild(flow.firstChild);
    }
  }

  // -- Portrait render mode: original/translated as paired rows instead of
  // one flowing paragraph per panel (see addLine above). Each "original"
  // message starts a new row (both cells created together, the translated
  // one empty at first); each "translated" message fills the row whose
  // original carries the same `seq` (see Pipeline._publish_captions). It
  // is matched by that number, not by arrival order, because the two streams
  // don't stay in step: originals keep arriving while Translate is off (or
  // lagging) and are never translated, so pairing the next translation with
  // the oldest row still waiting would shift every pair after it. A
  // translation whose row is gone (pruned, or its original never seen) is
  // simply dropped. --
  const portraitLines = document.getElementById('portrait-lines');  // outer .lines wrapper: clips, bottom-aligns
  const portraitGrid = document.getElementById('portrait-grid');    // inner, auto-height: what actually holds rows
  // Rows still waiting for their translation: seq -> that row's (empty)
  // translated cell. Insertion order = oldest first, which is what the
  // seq-less fallback in addPortraitTranslated relies on.
  const pendingTranslationCells = new Map();
  let localRowKey = 0;  // keys for rows built without a server seq (mode-switch rebuilds)

  function prunePortraitRows() {
    // Same idea and the same reason as addLine's own pruning: portraitLines
    // is bottom-aligned, so once its content overflows, the excess extends
    // upward, off the top - and scrollHeight only ever reports overflow in
    // the forward (downward) direction, so it can't see that. Measuring the
    // grid's own offsetHeight instead (it's un-clipped, sized to its true
    // content) sidesteps that entirely, exactly as flow.offsetHeight does
    // for the landscape panels.
    const style = getComputedStyle(portraitLines);
    const available = portraitLines.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    while (portraitGrid.children.length > 2 && portraitGrid.offsetHeight > available * HISTORY_RETENTION) {
      portraitGrid.removeChild(portraitGrid.firstChild);
      const pruned = portraitGrid.firstChild;
      if (pruned.rowKey !== undefined) pendingTranslationCells.delete(pruned.rowKey);
      portraitGrid.removeChild(pruned);
    }
  }

  function addPortraitOriginal(text, opts, seq) {
    const original = document.createElement('p');
    original.className = 'portrait-cell line original';
    markOldIfNewBatch('portrait-original', portraitGrid.querySelectorAll('.original:not(.recent)'), opts);
    original.style.margin = '0';
    original.textContent = text;
    const translated = document.createElement('p');
    translated.className = 'portrait-cell line translated';
    translated.style.margin = '0';
    const key = seq ?? `local-${localRowKey++}`;
    original.rowKey = key;
    translated.rowKey = key;
    const liveRow = recentRow ? recentRow[0] : null;  // final rows go above the live caption's row
    portraitGrid.insertBefore(original, liveRow);
    portraitGrid.insertBefore(translated, liveRow);
    pendingTranslationCells.set(key, translated);
    prunePortraitRows();
  }

  // `seq` is the original's number as sent by the server. Without one
  // (rebuilding after a mode switch, where each translation is added right
  // after its own original) it falls back to the oldest row still waiting.
  function addPortraitTranslated(text, opts, seq) {
    const key = seq ?? pendingTranslationCells.keys().next().value;
    const cell = pendingTranslationCells.get(key);
    if (!cell) return;  // no waiting row for it (pruned, or its original was never seen)
    pendingTranslationCells.delete(key);
    // Exclude cell itself (already in the grid, created empty alongside its
    // original back in addPortraitOriginal - it would dim itself otherwise)
    // and any other still-empty pending cell: those are later rows in the
    // same in-flight commit waiting for their own translation, not history,
    // and marking them old now would leave them stuck that way once filled.
    const others = Array.from(portraitGrid.querySelectorAll('.translated')).filter(
      (el) => el !== cell && el.textContent !== ''
    );
    markOldIfNewBatch('portrait-translated', others, opts);
    cell.textContent = text;
    prunePortraitRows();
  }

  // -- The live caption: the original text that isn't final yet (see
  // Pipeline._publish_captions), replaced as a whole on every update. It's
  // kept after the final sentences - its own paragraph below theirs in
  // landscape, the last row in portrait - and updated in place rather than
  // re-created, so it doesn't re-run the fade-in on every update. --
  let recentOriginal = '';
  let recentRow = null;  // portrait: [original cell, translated cell] of the live row
  // Per-viewer, like the render mode: whether the live text is shown at all.
  let showUnfinished = true;
  try {
    showUnfinished = localStorage.getItem('sts-unfinished-text') !== 'hide';
  } catch { /* storage blocked - default stands */ }

  function setRecentOriginal(text) {
    recentOriginal = text;
    renderRecentOriginal();
  }

  function renderRecentOriginal() {
    const portrait = renderMode === 'portrait';
    const text = showUnfinished ? recentOriginal : '';
    // Drop one left over in the other render mode's layout.
    for (const el of document.querySelectorAll(portrait ? '#original-lines .recent' : '#portrait-grid .recent')) {
      el.remove();
    }
    if (!portrait) recentRow = null;
    if (portrait) {
      if (!text) {
        if (recentRow) recentRow.forEach((el) => el.remove());
        recentRow = null;
        return;
      }
      if (!recentRow) {
        recentRow = ['original', 'translated'].map((side) => {
          const cell = document.createElement('p');
          cell.className = `portrait-cell line ${side} recent`;
          cell.style.margin = '0';
          portraitGrid.appendChild(cell);
          return cell;
        });
      }
      recentRow[0].textContent = text;
      prunePortraitRows();
      return;
    }
    // Landscape: a paragraph of its own, below the final sentences' one.
    const container = document.getElementById('original-lines');
    let para = container.querySelector(':scope > .recent');
    if (!text) {
      para?.remove();
      return;
    }
    if (!para) {
      para = document.createElement('p');
      para.className = 'line recent';
      para.style.margin = '0';
      container.appendChild(para);
    }
    para.textContent = text;
  }

  const unfinishedButtons = document.querySelectorAll('.render-mode button[data-unfinished]');
  function showUnfinishedChoice() {
    for (const button of unfinishedButtons) {
      const current = (button.dataset.unfinished === 'show') === showUnfinished;
      button.classList.toggle('is-active', current);
      button.setAttribute('aria-pressed', String(current));
    }
    document.body.classList.toggle('hide-unfinished', !showUnfinished);
  }
  showUnfinishedChoice();
  for (const button of unfinishedButtons) {
    button.addEventListener('click', () => {
      showUnfinished = button.dataset.unfinished === 'show';
      showUnfinishedChoice();
      renderRecentOriginal();
      try { localStorage.setItem('sts-unfinished-text', showUnfinished ? 'show' : 'hide'); } catch { /* ignore */ }
    });
  }

  // -- Switching Render mode: carries the existing transcript over into the
  // new layout instead of clearing it. -----------------------------------
  function textOf(el) {
    return el.textContent.trim();
  }

  // Snippets/rows carry the server's `seq` (numbers only - rows built
  // locally have none), which is what lets a switch pair them exactly.
  const seqOf = (key) => (typeof key === 'number' ? key : undefined);

  function transformLandscapeToPortrait() {
    const readFlow = (id) => {
      const flow = document.getElementById(id).querySelector('.flow');
      return flow ? Array.from(flow.children).map((el) => ({ text: textOf(el), seq: el.seq })).filter((x) => x.text) : [];
    };
    const originals = readFlow('original-lines');
    const translateds = readFlow('translated-lines');

    portraitGrid.innerHTML = '';
    recentRow = null;
    pendingTranslationCells.clear();
    // Rebuilding replays distinct, separately-timed historical lines through
    // the same add-functions as live updates - unlike a live burst, each one
    // really is older than the next, so each forces its own batch (dims
    // whatever came before it) rather than joining a shared "just arrived" one.
    const forced = { forceNewBatch: true };
    const numbered = [...originals, ...translateds].every((x) => x.seq !== undefined);
    if (numbered) {
      // Pair by sequence number: an original whose translation never came
      // (Translate was off, or lagged) gets an empty cell, and nothing after
      // it shifts.
      const translationOf = new Map(translateds.map((t) => [t.seq, t.text]));
      for (const o of originals) {
        addPortraitOriginal(o.text, forced, o.seq);
        if (translationOf.has(o.seq)) addPortraitTranslated(translationOf.get(o.seq), forced, o.seq);
      }
      return;
    }
    // No numbers to go on: landscape doesn't track which original a
    // translated snippet came from, and the two panels prune independently,
    // so they can hold different numbers of retained lines. Pairing the most
    // recent of each by position is the best available approximation; any
    // extra older lines on the longer side have no partner to line up with
    // and are dropped.
    const n = Math.min(originals.length, translateds.length);
    const recentOriginals = originals.slice(originals.length - n);
    const recentTranslateds = translateds.slice(translateds.length - n);
    for (let i = 0; i < n; i++) {
      addPortraitOriginal(recentOriginals[i].text, forced);
      addPortraitTranslated(recentTranslateds[i].text, forced);  // no seq: pairs with the row just added
    }
  }

  function transformPortraitToLandscape() {
    const read = (selector) =>
      Array.from(portraitGrid.querySelectorAll(selector))
        .map((el) => ({ text: textOf(el), seq: seqOf(el.rowKey) }))
        .filter((x) => x.text);
    const originals = read('.original:not(.recent)');
    const translateds = read('.translated:not(.recent)');

    document.getElementById('original-lines').querySelector('.flow')?.remove();
    document.getElementById('translated-lines').querySelector('.flow')?.remove();
    for (const o of originals) addLine('original-lines', o.text, { forceNewBatch: true }, o.seq);
    for (const t of translateds) addLine('translated-lines', t.text, { forceNewBatch: true }, t.seq);
  }

  const VERSE_DISPLAY_MS = 25000;
  let verseHideTimer = null;
  let lastVerseMsg = null;  // re-shown by the recall chips, below - null until the first verse this session
  // One banner per language per render mode - all four are kept in sync on
  // every "verse" message; only the ones in the currently visible panel(s)
  // are ever actually seen, same as the RTF indicators always update
  // regardless of what's on screen.
  const verseBanners = [
    { el: document.getElementById('verse-banner-ru'), field: 'ru_text' },
    { el: document.getElementById('verse-banner-en'), field: 'en_text' },
    { el: document.getElementById('verse-banner-portrait-ru'), field: 'ru_text' },
    { el: document.getElementById('verse-banner-portrait-en'), field: 'en_text' },
  ];
  // Small recall buttons - one alongside each banner - that bring the last
  // detected verse back after it's auto-dismissed (or been manually
  // dismissed). Unlike the banners, these stay up once shown.
  const verseChips = [
    document.getElementById('verse-chip-ru'),
    document.getElementById('verse-chip-en'),
    document.getElementById('verse-chip-portrait-ru'),
    document.getElementById('verse-chip-portrait-en'),
  ];

  function applyVerseText(msg) {
    for (const { el, field } of verseBanners) {
      el.querySelector('.verse-reference').textContent = msg.reference;
      el.querySelector('.verse-text').textContent = msg[field] || '';
    }
  }

  function dismissVerse() {
    clearTimeout(verseHideTimer);
    for (const { el } of verseBanners) el.classList.remove('show');
  }

  // Brings the last detected verse back with no auto-dismiss timer - only
  // dismissVerse() (the click-outside handler, below) hides it again.
  function pinVerse() {
    if (!lastVerseMsg) return;
    applyVerseText(lastVerseMsg);
    for (const { el } of verseBanners) el.classList.add('show');
    clearTimeout(verseHideTimer);
  }

  function showVerse(msg) {
    lastVerseMsg = msg;
    applyVerseText(msg);
    for (const { el } of verseBanners) el.classList.add('show');
    for (const chip of verseChips) {
      chip.textContent = msg.reference;
      chip.classList.add('show');
    }

    clearTimeout(verseHideTimer);
    verseHideTimer = setTimeout(dismissVerse, VERSE_DISPLAY_MS);
  }

  for (const chip of verseChips) {
    chip.addEventListener('click', (event) => {
      event.stopPropagation();  // don't let this same click reach the outside-click handler below
      pinVerse();
    });
  }

  // Clicking anywhere outside a shown banner (and outside the chips, which
  // have their own handler above) dismisses it - the "manually click out to
  // dismiss" behavior a pinned verse needs, but applied whenever a banner is
  // showing, auto-dismiss pending or not.
  document.addEventListener('click', (event) => {
    if (!verseBanners.some(({ el }) => el.classList.contains('show'))) return;
    if (verseBanners.some(({ el }) => el.contains(event.target))) return;
    if (verseChips.some((chip) => chip.contains(event.target))) return;
    dismissVerse();
  });

  const finalizeCountdowns = document.querySelectorAll('.finalize-countdown');
  function setFinalizeCountdown(seconds) {
    for (const el of finalizeCountdowns) {
      el.classList.toggle('show', seconds != null);
      if (seconds != null) el.textContent = `Finalizing in ${seconds}s`;
    }
  }

  function clearCaptions() {
    document.getElementById('original-lines').innerHTML = '';
    document.getElementById('translated-lines').innerHTML = '';
    portraitGrid.innerHTML = '';
    recentRow = null;
    recentOriginal = '';
    setFinalizeCountdown(null);
    pendingTranslationCells.clear();
    dismissVerse();
    lastVerseMsg = null;
    for (const chip of verseChips) chip.classList.remove('show');
  }

  const asrToggleBtn = document.getElementById('btn-asr-toggle');
  const translateToggleBtn = document.getElementById('btn-translate-toggle');
  const ttsToggleBtn = document.getElementById('btn-tts-toggle');
  const trainBtn = document.getElementById('btn-train');
  const resetBtn = document.getElementById('btn-reset');
  const saveBtn = document.getElementById('btn-save-voice');
  const cfgInput = document.getElementById('cfg-input');
  const cfgOutput = document.getElementById('cfg-output');
  let lastDevices = null;
  const volumeSlider = document.getElementById('volume-slider');
  const volumeValue = document.getElementById('volume-value');
  let draggingVolume = false;
  const createBtn = document.getElementById('btn-create-voice');
  const designDialog = document.getElementById('design-dialog');
  const designPrompt = document.getElementById('design-prompt');
  const designSample = document.getElementById('design-sample');
  const designName = document.getElementById('design-name');
  const designStatus = document.getElementById('design-status');
  const designGenerate = document.getElementById('design-generate');
  const designPlay = document.getElementById('design-play');
  const designSave = document.getElementById('design-save');
  const saveDialog = document.getElementById('save-dialog');
  const saveName = document.getElementById('save-name');
  const saveNote = document.getElementById('save-note');
  let libraryNames = [];
  const voiceSelect = document.getElementById('voice-select');
  const deleteBtn = document.getElementById('btn-delete-voice');
  let defaultVoices = [];   // built-in voice names (the "Default" group)
  let savedVoices = [];     // [{id, name}] from the voice library (the "Custom" group)
  let lastStatus = {
    active: true, translation_enabled: true, voice_enabled: false, training: false,
    training_seconds: 0, training_target_seconds: 0, cloned: false, active_speaker_id: null,
    audio_source: 'alsa',
  };
  // Mirrors the last 'stage' message's `ready` flag: false while starting up
  // *and* while switching ASR engines (Pipeline._stage defaults ready to
  // False for every non-"Listening" stage, so this comes for free).
  let systemReady = false;

  // A toggle is only meaningful when what it controls can actually do
  // something: Translate has nothing to translate with Caption off, Voice
  // has nothing to speak unless both upstream stages are actually running.
  function updateEngineAvailability() {
    const connected = ws && ws.readyState === WebSocket.OPEN;
    const ready = systemReady && connected;
    asrToggleBtn.disabled = !ready;
    translateToggleBtn.disabled = !ready || !lastStatus.active;
    ttsToggleBtn.disabled = !ready || !lastStatus.active || !lastStatus.translation_enabled;
  }

  function resetEngineInfo() {
    // Stale model/device info left over from before a restart/reconnect is
    // actively misleading, not just cosmetically outdated - a fresh
    // 'engines' message replaces this once the backend is back.
    for (const id of ['asr-info-model', 'asr-info-device', 'asr-info-source',
                       'translate-info-model', 'translate-info-device',
                       'tts-info-model', 'tts-info-device']) {
      document.getElementById(id).textContent = '–';
    }
  }

  // -- Caption/Translated panels: hidden while their engine is off, "System
  // Idle" shown once neither has anything left to display. --------------------
  const originalPanel = document.getElementById('original-panel');
  const translatedPanel = document.getElementById('translated-panel');
  const portraitPanel = document.getElementById('portrait-panel');
  const idleMessage = document.getElementById('idle-message');
  const renderModeButtons = document.querySelectorAll('.render-mode button[data-mode]');

  // Per-viewer display preference, not an operator setting - each connected
  // screen picks its own (e.g. a portrait-mounted display vs a landscape
  // one), so this lives in this browser's storage rather than the shared
  // pipeline config.
  let renderMode = 'landscape';
  try {
    renderMode = localStorage.getItem('sts-render-mode') || 'landscape';
  } catch { /* private browsing / storage blocked - default stands */ }
  function showRenderMode() {
    for (const button of renderModeButtons) {
      const current = button.dataset.mode === renderMode;
      button.classList.toggle('is-active', current);
      button.setAttribute('aria-pressed', String(current));
    }
  }
  showRenderMode();
  updatePanelVisibility();  // apply it immediately, before the first status message arrives

  for (const button of renderModeButtons) {
    button.addEventListener('click', () => setRenderMode(button.dataset.mode));
  }

  function setRenderMode(newMode) {
    if (newMode === renderMode) return;
    renderMode = newMode;
    showRenderMode();
    // Reveal the target panel *before* transforming into it - the pruning
    // inside addPortraitOriginal/addLine measures the container's real
    // rendered height, which is 0 while it's still `hidden`.
    updatePanelVisibility();
    // Carry the existing transcript over into the new layout rather than
    // wiping it - see transformLandscapeToPortrait/transformPortraitToLandscape.
    if (newMode === 'portrait') transformLandscapeToPortrait(); else transformPortraitToLandscape();
    renderRecentOriginal();
    try { localStorage.setItem('sts-render-mode', renderMode); } catch { /* ignore */ }
  }

  function updatePanelVisibility() {
    const portrait = renderMode === 'portrait';
    originalPanel.hidden = portrait || !lastStatus.active;
    translatedPanel.hidden = portrait || !lastStatus.translation_enabled;
    portraitPanel.hidden = !portrait || (!lastStatus.active && !lastStatus.translation_enabled);
    portraitPanel.classList.toggle('hide-original', !lastStatus.active);
    portraitPanel.classList.toggle('hide-translated', !lastStatus.translation_enabled);
    const idle = !lastStatus.active && !lastStatus.translation_enabled;
    idleMessage.classList.toggle('show', idle);
    rtfOff.asr = idle || !lastStatus.active;
    rtfOff.translate = idle || !lastStatus.translation_enabled;
    rtfOff.voice = idle || !lastStatus.voice_enabled;
    for (const [stage, off] of Object.entries(rtfOff)) {
      if (!off) continue;
      const el = document.getElementById(RTF_ELEMENT_IDS[stage]);
      el.querySelector('b').textContent = '–';
      el.classList.remove('slow');
      el.classList.add('unknown');
    }
  }

  // One dropdown, two groups. Option values are tagged so the two kinds can't
  // collide: "default:<name>", "saved:<id>", or "unsaved" for a just-trained
  // voice that isn't in the library yet.
  function currentVoiceValue() {
    if (lastStatus.active_speaker_id) return `saved:${lastStatus.active_speaker_id}`;
    if (lastStatus.cloned) return 'unsaved';
    return lastStatus.default_voice ? `default:${lastStatus.default_voice}` : '';
  }

  function renderVoiceSelect() {
    const unsaved = !lastStatus.active_speaker_id && lastStatus.cloned;
    // Rebuild only when the list itself changes, so a status update (they arrive
    // constantly during training) can't snap an open dropdown shut.
    const signature = JSON.stringify([defaultVoices, savedVoices, unsaved ? lastStatus.can_save : null]);
    if (voiceSelect.dataset.signature !== signature) {
      voiceSelect.dataset.signature = signature;
      voiceSelect.innerHTML = '';
      const addGroup = (label, options) => {
        if (!options.length) return;
        const group = document.createElement('optgroup');
        group.label = label;
        for (const { value, text } of options) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = text;
          group.appendChild(option);
        }
        voiceSelect.appendChild(group);
      };
      // Voices shipped with the app (the bundled "Default") lead the Default group; the user's saved ones are Custom.
      const shipped = savedVoices.filter((voice) => voice.builtin).map((voice) => ({ value: `saved:${voice.id}`, text: voice.name }));
      addGroup('Default', [...shipped, ...defaultVoices.map((name) => ({ value: `default:${name}`, text: name }))]);
      const custom = savedVoices.filter((voice) => !voice.builtin).map((voice) => ({ value: `saved:${voice.id}`, text: voice.name }));
      if (unsaved) {
        custom.unshift({ value: 'unsaved', text: lastStatus.can_save ? 'New voice (unsaved)' : 'Cloned voice (this session)' });
      }
      addGroup('Custom', custom);
    }
    voiceSelect.value = currentVoiceValue();
    syncDeleteButton();
  }

  function applyStatus(status) {
    lastStatus = status;

    asrToggleBtn.textContent = (status.active ? '● ' : '○ ') + 'Caption';
    asrToggleBtn.classList.toggle('is-active', status.active);

    translateToggleBtn.textContent = (status.translation_enabled ? '● ' : '○ ') + 'Translate';
    translateToggleBtn.classList.toggle('is-active', status.translation_enabled);

    ttsToggleBtn.textContent = (status.voice_enabled ? '● ' : '○ ') + 'Voice';
    ttsToggleBtn.classList.toggle('is-active', status.voice_enabled);

    if (status.training) {
      trainBtn.textContent = `Stop training (${status.training_seconds}s / ${status.training_target_seconds}s)`;
    } else {
      trainBtn.textContent = status.cloned ? 'Train voice (cloned ✓)' : 'Train voice';
    }
    trainBtn.classList.toggle('is-active', status.training);
    saveBtn.disabled = !status.can_save || status.training;
    createBtn.hidden = !status.can_design;
    if (!status.can_save) closeSaveDialog();

    if (status.output_volume != null && !draggingVolume) {
      volumeSlider.value = status.output_volume;
      volumeValue.textContent = `${status.output_volume}%`;
    }
    if (status.voice_groups) defaultVoices = Object.values(status.voice_groups).flat();
    renderVoiceSelect();

    updatePanelVisibility();

    document.getElementById('asr-info-source').textContent =
      status.audio_source === 'browser' ? "This browser's mic" : 'ALSA (local device)';
    // The server may have switched us back to ALSA on its own (e.g. another
    // tab picked a device, or this tab's mic connection dropped) - stop the
    // local capture without sending a redundant mic_stop back.
    if (status.audio_source !== 'browser' && micActive) stopBrowserMic(false);
    updateMicButton();

    updateEngineAvailability();
  }

  function applyLibrary(msg) {
    libraryNames = msg.speakers.map((speaker) => speaker.name);
    savedVoices = msg.speakers;
    renderVoiceSelect();
  }

  let ws = null;
  function send(action, extra = {}) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action, ...extra }));
    }
  }

  asrToggleBtn.addEventListener('click', () => send(lastStatus.active ? 'stop' : 'start'));
  translateToggleBtn.addEventListener('click', () => send(lastStatus.translation_enabled ? 'translate_off' : 'translate_on'));
  ttsToggleBtn.addEventListener('click', () => send(lastStatus.voice_enabled ? 'voice_off' : 'voice_on'));

  // -- Dropdowns (hovering the Caption/Translate/Voice buttons or either level
  // meter opens its settings panel) --
  const engineDropdowns = document.querySelectorAll('.engine-dropdown');
  function closeDropdowns(except) {
    engineDropdowns.forEach((d) => { if (d !== except) d.classList.remove('show'); });
  }
  // trigger: the element whose hover opens the dropdown. container: the
  // element whose mouseleave closes it again - wider than the trigger alone
  // (or, for the meters, the same element the dropdown lives inside of) so
  // moving the mouse down into the open dropdown doesn't immediately hide it.
  function wireHoverDropdown(trigger, dropdown, container, opts = {}) {
    trigger.addEventListener('mouseenter', () => {
      closeDropdowns(dropdown);
      dropdown.classList.add('show');
      if (opts.refreshDevices) send('refresh_devices');  // pick up devices plugged in since the page loaded
    });
    container.addEventListener('mouseleave', () => dropdown.classList.remove('show'));
  }
  document.querySelectorAll('.engine').forEach((engine) => {
    wireHoverDropdown(engine.querySelector('.engine-toggle'), engine.querySelector('.engine-dropdown'), engine);
  });
  ['volume-meter', 'output-meter'].forEach((id) => {
    const meter = document.getElementById(id);
    wireHoverDropdown(meter, meter.querySelector('.engine-dropdown'), meter, { refreshDevices: true });
  });
  document.addEventListener('click', (event) => {
    if (!event.target.closest('.engine-dropdown') && !event.target.closest('.engine-toggle')
        && !event.target.closest('#volume-meter') && !event.target.closest('#output-meter')) {
      closeDropdowns();
    }
  });

  function applyEngines(msg) {
    document.getElementById('asr-info-model').textContent = msg.asr?.model || '–';
    document.getElementById('asr-info-device').textContent = msg.asr?.device || '–';
    document.getElementById('translate-info-model').textContent = msg.translation?.model || '–';
    document.getElementById('translate-info-device').textContent = msg.translation?.device || '–';
    document.getElementById('tts-info-model').textContent = msg.tts?.model || '–';
    document.getElementById('tts-info-device').textContent = msg.tts?.device || '–';
  }

  function applyRtf(msg) {
    const id = RTF_ELEMENT_IDS[msg.stage];
    if (!id || typeof msg.value !== 'number' || rtfOff[msg.stage]) return;
    const el = document.getElementById(id);
    el.querySelector('b').textContent = `${msg.value.toFixed(2)}x`;
    el.classList.remove('unknown');
    el.classList.toggle('slow', msg.value >= 1.0);
  }

  // -- Input/output level meters (10 bars each, either side of Caption/Voice) --
  // The server sends raw RMS (0..~1) - input throttled to ~100ms, output per
  // ~100ms of actually-playing audio; everything about turning that into a
  // bar count and coloring lives here so it's tunable without touching the
  // backend.
  const volumeBars = Array.from(document.querySelectorAll('#volume-meter .volume-bar'));
  const outputBars = Array.from(document.querySelectorAll('#output-meter .volume-bar'));
  const VOLUME_FLOOR_DB = -50;  // at/below this: silence, no bars lit
  const VOLUME_CEILING_DB = -6; // at/above this: all 10 bars lit

  function levelToBarCount(rms, bars) {
    if (!(rms > 0)) return 0;
    const db = 20 * Math.log10(rms);
    if (db <= VOLUME_FLOOR_DB) return 0;
    const frac = Math.min(1, (db - VOLUME_FLOOR_DB) / (VOLUME_CEILING_DB - VOLUME_FLOOR_DB));
    return Math.round(frac * bars.length);
  }

  function applyLevel(bars, rms) {
    const lit = levelToBarCount(rms, bars);
    bars.forEach((bar, i) => {
      const position = i + 1;
      bar.classList.toggle('lit-quiet', position <= lit && position <= 5);
      bar.classList.toggle('lit-good', position <= lit && position > 5);
    });
  }

  const applyInputLevel = (msg) => applyLevel(volumeBars, msg.level);
  const applyOutputLevel = (msg) => applyLevel(outputBars, msg.level);

  trainBtn.addEventListener('click', () => {
    if (lastStatus.training) {
      send('train_stop');
    } else {
      send('train_start');
    }
  });
  resetBtn.addEventListener('click', () => send('reset'));
  // -- Create Voice (Qwen3 voice design) ------------------------------------
  function applyDesign(msg) {
    const busy = msg.state === 'busy';
    designStatus.textContent = msg.message || '';
    designStatus.classList.toggle('error', msg.state === 'error');
    designGenerate.disabled = busy;
    designPlay.disabled = busy || !msg.has_voice;
    designSave.disabled = busy || !msg.has_voice;
    if (msg.state === 'saved') {
      designDialog.classList.remove('show');
    }
  }

  createBtn.addEventListener('click', () => {
    designName.value = '';
    designDialog.classList.add('show');
    designPrompt.focus();
  });
  designGenerate.addEventListener('click', () => {
    if (designPrompt.value.trim()) send('design_generate', { prompt: designPrompt.value });
  });
  designPlay.addEventListener('click', () => {
    if (designSample.value.trim()) send('design_play', { text: designSample.value });
  });
  designSave.addEventListener('click', () => {
    const name = designName.value.trim();
    if (!name) { designName.focus(); return; }
    const exists = libraryNames.some((existing) => existing.trim().toLowerCase() === name.toLowerCase());
    if (exists && !confirm(`A voice named "${name}" already exists. Replace it?`)) return;
    send('design_save', { name });
  });
  document.getElementById('design-close').addEventListener('click', () => {
    designDialog.classList.remove('show');
    send('design_close');
  });

  function openSaveDialog() {
    saveName.value = '';
    saveNote.textContent = '';
    saveDialog.classList.add('show');
    saveName.focus();
  }

  function closeSaveDialog() {
    saveDialog.classList.remove('show');
  }

  saveName.addEventListener('input', () => {
    const name = saveName.value.trim().toLowerCase();
    const exists = libraryNames.some((existing) => existing.trim().toLowerCase() === name);
    saveNote.textContent = exists ? 'A voice with this name already exists - saving will replace it.' : '';
  });
  saveBtn.addEventListener('click', openSaveDialog);
  document.getElementById('save-cancel').addEventListener('click', closeSaveDialog);
  document.getElementById('save-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const name = saveName.value.trim();
    if (!name) return;
    send('save_voice', { name });
    closeSaveDialog();
  });

  // Live output volume: the label follows the thumb; the value goes to the
  // backend as it moves, throttled so a fast drag doesn't flood the socket.
  let volumeTimer = null;
  volumeSlider.addEventListener('pointerdown', () => { draggingVolume = true; });
  window.addEventListener('pointerup', () => { draggingVolume = false; });
  volumeSlider.addEventListener('input', () => {
    volumeValue.textContent = `${volumeSlider.value}%`;
    clearTimeout(volumeTimer);
    volumeTimer = setTimeout(() => send('set_output_volume', { percent: Number(volumeSlider.value) }), 80);
  });

  // -- Audio devices (input in the Caption dropdown, output in the Voice one) --
  const deviceValue = (index) => (index == null ? '' : String(index));

  function fillDeviceSelect(select, devices, selected) {
    // No "System default" option: it can resolve to a device that conflicts
    // with another real device on the same physical hardware (seen here
    // with two ALSA views of one onboard codec) in a way that's outside
    // this app's control to fix, and the operator always wants a specific,
    // predictable device for a fixed A/V setup like this anyway.
    select.innerHTML = '';
    for (const device of devices) {
      const option = document.createElement('option');
      option.value = String(device.index);
      option.textContent = `${device.index}: ${device.name}`;
      select.appendChild(option);
    }
    select.value = deviceValue(selected);
  }

  function applyDevices(msg) {
    lastDevices = msg;
    // Don't rebuild the lists under the user's cursor while they're choosing,
    // and never while a change of theirs is what's actually being applied.
    if (document.activeElement !== cfgInput && document.activeElement !== cfgOutput) {
      fillDeviceSelect(cfgInput, msg.inputs, msg.input);
      fillDeviceSelect(cfgOutput, msg.outputs, msg.output);
    }
    if (msg.error) {
      console.warn(`[audio] ${msg.error}`);
      fillDeviceSelect(cfgInput, msg.inputs, msg.input);   // show what is really in use
      fillDeviceSelect(cfgOutput, msg.outputs, msg.output);
    }
  }

  // Each select applies on its own, immediately, carrying the other's current
  // value along (the backend action always takes both together).
  cfgInput.addEventListener('change', () => send('set_audio_devices', { input: cfgInput.value, output: cfgOutput.value }));
  cfgOutput.addEventListener('change', () => send('set_audio_devices', { input: cfgInput.value, output: cfgOutput.value }));

  // -- Browser microphone as an alternate ASR input ----------------------------
  // Mirrors the outgoing TTS-audio format (broadcast_audio/playAudioChunk):
  // a 4-byte LE sample-rate header followed by raw float32 LE mono PCM, just
  // flowing the other way. The server needs each frame to be exactly one
  // block_ms (32ms @ 16kHz = 512 samples) worth of audio for the VAD, so the
  // AudioContext is forced to 16kHz (the browser resamples the mic's native
  // rate into it automatically) and a small worklet batches its 128-sample
  // render quantums into exact 512-sample frames before they're sent.
  const MIC_SAMPLE_RATE = 16000;
  const MIC_BLOCK_SAMPLES = 512;
  const MIC_WORKLET_SRC = `
    class MicFramer extends AudioWorkletProcessor {
      constructor() {
        super();
        this._buffer = new Float32Array(${MIC_BLOCK_SAMPLES});
        this._filled = 0;
      }
      process(inputs) {
        const input = inputs[0][0];
        if (input) {
          let offset = 0;
          while (offset < input.length) {
            const take = Math.min(input.length - offset, this._buffer.length - this._filled);
            this._buffer.set(input.subarray(offset, offset + take), this._filled);
            this._filled += take;
            offset += take;
            if (this._filled === this._buffer.length) {
              this.port.postMessage(this._buffer.slice());
              this._filled = 0;
            }
          }
        }
        return true;
      }
    }
    registerProcessor('mic-framer', MicFramer);
  `;

  const micBtn = document.getElementById('btn-browser-mic');
  const micStatusEl = document.getElementById('mic-status');
  let micActive = false;
  let micStream = null;
  let micAudioCtx = null;
  let micSourceNode = null;
  let micWorkletNode = null;

  function updateMicButton() {
    micBtn.textContent = micActive ? '⏹ Stop browser mic' : "🎤 Use this browser's mic";
    micBtn.classList.toggle('is-active', micActive);
    document.getElementById('mic-badge').classList.toggle('show', micActive);
  }

  async function startBrowserMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (location.protocol === 'http:') {
        // getUserMedia needs a secure context, which plain HTTP isn't - this
        // server also listens on HTTPS (default port 443) for exactly this,
        // so jump there instead of just telling the operator to type a
        // different URL themselves. (Assumes the standard 443; if
        // --https-port was set to something else, this won't find it.)
        location.href = `https://${location.hostname}${location.pathname}${location.search}`;
        return;
      }
      micStatusEl.textContent = 'Microphone access needs HTTPS (or localhost) - this page is served over plain HTTP.';
      micStatusEl.classList.add('error');
      return;
    }
    micStatusEl.textContent = '';
    micStatusEl.classList.remove('error');
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      micAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: MIC_SAMPLE_RATE });
      if (micAudioCtx.sampleRate !== MIC_SAMPLE_RATE) {
        throw new Error(`this browser would not honor a ${MIC_SAMPLE_RATE} Hz AudioContext (got ${micAudioCtx.sampleRate} Hz)`);
      }
      const moduleUrl = URL.createObjectURL(new Blob([MIC_WORKLET_SRC], { type: 'application/javascript' }));
      await micAudioCtx.audioWorklet.addModule(moduleUrl);
      micSourceNode = micAudioCtx.createMediaStreamSource(micStream);
      micWorkletNode = new AudioWorkletNode(micAudioCtx, 'mic-framer');
      const header = new Uint8Array(4);
      new DataView(header.buffer).setUint32(0, MIC_SAMPLE_RATE, true);
      micWorkletNode.port.onmessage = (event) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const frame = event.data;  // Float32Array, exactly MIC_BLOCK_SAMPLES samples
        const payload = new Uint8Array(header.length + frame.byteLength);
        payload.set(header, 0);
        payload.set(new Uint8Array(frame.buffer, frame.byteOffset, frame.byteLength), header.length);
        ws.send(payload);
      };
      micSourceNode.connect(micWorkletNode);
      micActive = true;
      send('mic_start');
    } catch (err) {
      micStatusEl.textContent = `Couldn't use this browser's mic: ${err.message || err}`;
      micStatusEl.classList.add('error');
      stopBrowserMic(false);
    }
    updateMicButton();
  }

  function stopBrowserMic(notifyServer = true) {
    if (micWorkletNode) { micWorkletNode.port.onmessage = null; micWorkletNode.disconnect(); micWorkletNode = null; }
    if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
    if (micAudioCtx) { micAudioCtx.close(); micAudioCtx = null; }
    if (micStream) { micStream.getTracks().forEach((track) => track.stop()); micStream = null; }
    const wasActive = micActive;
    micActive = false;
    if (notifyServer && wasActive) send('mic_stop');
    updateMicButton();
  }

  micBtn.addEventListener('click', () => (micActive ? stopBrowserMic() : startBrowserMic()));
  window.addEventListener('beforeunload', () => stopBrowserMic(false));  // release the mic indicator promptly

  function syncDeleteButton() {
    // Only offered while one of the user's own saved (Custom) voices is selected.
    const saved = savedVoices.find((voice) => `saved:${voice.id}` === voiceSelect.value);
    deleteBtn.hidden = !saved || saved.builtin;  // shipped voices can't be deleted
  }
  deleteBtn.addEventListener('click', () => {
    if (!voiceSelect.value.startsWith('saved:')) return;
    const id = voiceSelect.value.slice('saved:'.length);
    const name = voiceSelect.options[voiceSelect.selectedIndex].textContent;
    if (confirm(`Delete the voice "${name}"? This can't be undone.`)) send('delete_voice', { speaker_id: id });
  });
  voiceSelect.addEventListener('change', () => {
    const value = voiceSelect.value;
    if (value.startsWith('default:')) send('default_voice', { voice: value.slice('default:'.length) });
    else if (value.startsWith('saved:')) send('select_speaker', { speaker_id: value.slice('saved:'.length) });
    else renderVoiceSelect();  // "unsaved" is already active; nothing to switch to
    syncDeleteButton();
  });

  // -- Audio streaming (TTS dropdown checkbox) --------------------------------
  // Off by default each visit (remembered locally so a reload keeps the choice);
  // gated purely client-side since the server already only produces clips when
  // TTS voicing is on, so there is nothing extra to ask it to skip.
  const streamToggle = document.getElementById('stream-toggle');
  let streamEnabled = false;
  try { streamEnabled = localStorage.getItem('sts-stream-audio') === '1'; } catch {}
  let audioCtx = null;
  let streamGain = null;
  let nextStartTime = 0;  // AudioContext time the next scheduled chunk should start at

  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      streamGain = audioCtx.createGain();
      streamGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function updateStreamButton() {
    streamToggle.textContent = streamEnabled ? '⏹ Stop streaming to this browser' : '🔊 Stream voice to this browser';
    streamToggle.classList.toggle('is-active', streamEnabled);
    document.getElementById('stream-badge').classList.toggle('show', streamEnabled);
  }
  updateStreamButton();

  streamToggle.addEventListener('click', () => {
    streamEnabled = !streamEnabled;
    try { localStorage.setItem('sts-stream-audio', streamEnabled ? '1' : '0'); } catch {}
    if (streamEnabled) {
      // Start fresh from "now" rather than dumping whatever arrived while off.
      nextStartTime = ensureAudioContext().currentTime;
    }
    updateStreamButton();
  });

  document.getElementById('btn-test-output').addEventListener('click', () => send('test_output'));

  // Each binary frame: 4-byte LE sample rate header + raw float32 LE mono PCM
  // (see CaptionBroadcaster.broadcast_audio). Chunks are scheduled back to
  // back on one AudioContext timeline so consecutive sentences play without
  // gaps, the same way the server's own local playback stitches clips together.
  function playAudioChunk(buffer) {
    if (!streamEnabled || buffer.byteLength <= 4) return;
    const ctx = ensureAudioContext();
    const sampleRate = new DataView(buffer).getUint32(0, true);
    const samples = new Float32Array(buffer, 4);
    if (!samples.length) return;
    const audioBuffer = ctx.createBuffer(1, samples.length, sampleRate);
    audioBuffer.copyToChannel(samples, 0);
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(streamGain);
    const startAt = Math.max(ctx.currentTime, nextStartTime);
    source.start(startAt);
    nextStartTime = startAt + audioBuffer.duration;
  }

  function connect() {
    const stage = document.getElementById('stage');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      // The server replays recent captions on connect, so start clean to
      // avoid duplicates after a reconnect. It also replays the current
      // stage right away, so "Reconnecting…" below is only visible for the
      // brief gap until that arrives.
      clearCaptions();
    };
    ws.onerror = () => ws.close();
    ws.onclose = () => {
      stage.textContent = 'Reconnecting…';
      stage.className = '';
      systemReady = false;
      volumeBars.forEach((bar) => bar.classList.remove('lit-quiet', 'lit-good'));
      outputBars.forEach((bar) => bar.classList.remove('lit-quiet', 'lit-good'));
      closeDropdowns();  // don't leave one open showing now-stale info across a reconnect
      setFinalizeCountdown(null);  // the server's countdown stops with the connection
      resetEngineInfo();
      updateEngineAvailability();
      setTimeout(connect, 1000);
    };
    ws.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) { playAudioChunk(event.data); return; }
      const msg = JSON.parse(event.data);
      if (msg.type === 'original') {
        if (renderMode === 'portrait') addPortraitOriginal(msg.text, { batch: msg.batch }, msg.seq); else addLine('original-lines', msg.text, { batch: msg.batch }, msg.seq);
      } else if (msg.type === 'original_recent') {
        setRecentOriginal(msg.text);
      } else if (msg.type === 'finalize_countdown') {
        setFinalizeCountdown(msg.seconds);
      } else if (msg.type === 'translated') {
        if (renderMode === 'portrait') addPortraitTranslated(msg.text, { batch: msg.batch }, msg.seq); else addLine('translated-lines', msg.text, { batch: msg.batch }, msg.seq);
      }
      else if (msg.type === 'verse') showVerse(msg);
      else if (msg.type === 'reset') clearCaptions();
      else if (msg.type === 'stage') {
        stage.textContent = msg.text;
        stage.className = msg.ready ? 'ready' : '';
        systemReady = !!msg.ready;
        updateEngineAvailability();
      }
      else if (msg.type === 'status') applyStatus(msg);
      else if (msg.type === 'library') applyLibrary(msg);
      else if (msg.type === 'design') applyDesign(msg);
      else if (msg.type === 'devices') applyDevices(msg);
      else if (msg.type === 'engines') applyEngines(msg);
      else if (msg.type === 'rtf') applyRtf(msg);
      else if (msg.type === 'input_level') applyInputLevel(msg);
      else if (msg.type === 'output_level') applyOutputLevel(msg);
    };
  }

  connect();
</script>

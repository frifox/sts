<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sts — live captions</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  .panel {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
    box-sizing: border-box;
  }

  #original-panel { background: #0b0b0f; border-bottom: 2px solid #222; }
  #translated-panel { background: #000; }

  .label {
    position: absolute;
    top: 0.6vh;
    left: 1.2vw;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
    z-index: 1;
  }

  .lines {
    height: 100%;
    box-sizing: border-box;
    padding: 4.5vh 3vw 1.5vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 0.4em;
  }

  .line {
    font-size: clamp(1.4rem, 4vw, 3.2rem);
    line-height: 1.25;
    animation: fade-in 0.25s ease-out;
  }

  .line.old { opacity: 0.4; transition: opacity 0.6s ease; }

  #original-lines .line { color: #9cdcfe; }
  #translated-lines .line { color: #e8c07d; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #status {
    position: fixed;
    top: 0.6vh;
    right: 1.2vw;
    font-size: 0.75rem;
    color: #444;
    z-index: 2;
  }

  #verse-overlay {
    position: fixed;
    top: 0;
    left: 50%;
    z-index: 3;
    width: min(90vw, 60rem);
    box-sizing: border-box;
    padding: 2.2vh 3vw;
    background: rgba(10, 10, 12, 0.96);
    border-bottom: 3px solid #c9a24b;
    border-left: 1px solid #333;
    border-right: 1px solid #333;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    transform: translate(-50%, -105%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #verse-overlay.show { transform: translate(-50%, 0); }

  .verse-reference {
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c9a24b;
    margin-bottom: 0.6em;
  }

  .verse-text {
    font-size: clamp(1.1rem, 2.6vw, 1.8rem);
    line-height: 1.4;
    margin-bottom: 0.5em;
  }

  #verse-ru { color: #9cdcfe; }
  #verse-en { color: #e8c07d; }

  #controls {
    position: fixed;
    bottom: 1.2vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex;
    gap: 0.6em;
    padding: 0.5em;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    opacity: 0.35;
    transition: opacity 0.2s ease;
  }

  #controls:hover, #controls:focus-within { opacity: 1; }

  #controls button {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 1em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1a1a1e;
    color: #ccc;
    cursor: pointer;
  }

  #controls button:hover { border-color: #777; }

  #controls input, #controls select {
    font: inherit;
    font-size: 0.9rem;
    padding: 0.5em 0.7em;
    border-radius: 6px;
    border: 1px solid #444;
    background: #111;
    color: #ccc;
  }

  #train-name { width: 9em; }

  #btn-toggle.is-active { background: #1f4d2b; border-color: #3a9350; color: #d7ffdf; }
  #btn-voice.is-active { background: #1f3d4d; border-color: #3a90c9; color: #d7f3ff; }
  #btn-train.is-active { background: #4d3a1f; border-color: #c9a24b; color: #ffe9bf; }
  #btn-reset { color: #e08a8a; }
</style>
</head>
<body>
  <div id="app">
    <div class="panel" id="original-panel">
      <span class="label">Original</span>
      <div class="lines" id="original-lines"></div>
    </div>
    <div class="panel" id="translated-panel">
      <span class="label">Translated</span>
      <div class="lines" id="translated-lines"></div>
    </div>
  </div>
  <div id="status"></div>

  <div id="verse-overlay">
    <div class="verse-reference" id="verse-reference"></div>
    <div class="verse-text" id="verse-ru"></div>
    <div class="verse-text" id="verse-en"></div>
  </div>

  <div id="controls">
    <button id="btn-toggle">Stop</button>
    <button id="btn-voice">🔇 Voice off</button>
    <input id="train-name" type="text" placeholder="Speaker name" />
    <button id="btn-train">Train voice</button>
    <select id="speaker-select">
      <option value="">— no cloned voice —</option>
    </select>
    <button id="btn-reset">Reset</button>
  </div>

<script>
  function addLine(containerId, text) {
    const container = document.getElementById(containerId);
    const line = document.createElement('div');
    line.className = 'line';
    line.textContent = text;
    for (const previous of container.children) previous.classList.add('old');
    container.appendChild(line);

    // Drop the oldest lines once content no longer fits, so the DOM (and
    // the visible page) never grows without bound during a long stream.
    while (container.children.length > 1 && container.scrollHeight > container.clientHeight) {
      container.removeChild(container.firstChild);
    }
  }

  const VERSE_DISPLAY_MS = 25000;
  let verseHideTimer = null;

  function showVerse(msg) {
    document.getElementById('verse-reference').textContent = msg.reference;
    document.getElementById('verse-ru').textContent = msg.ru_text || '';
    document.getElementById('verse-en').textContent = msg.en_text || '';

    const overlay = document.getElementById('verse-overlay');
    overlay.classList.add('show');

    clearTimeout(verseHideTimer);
    verseHideTimer = setTimeout(() => overlay.classList.remove('show'), VERSE_DISPLAY_MS);
  }

  function clearCaptions() {
    document.getElementById('original-lines').innerHTML = '';
    document.getElementById('translated-lines').innerHTML = '';
    document.getElementById('verse-overlay').classList.remove('show');
    clearTimeout(verseHideTimer);
  }

  const toggleBtn = document.getElementById('btn-toggle');
  const voiceBtn = document.getElementById('btn-voice');
  const trainBtn = document.getElementById('btn-train');
  const resetBtn = document.getElementById('btn-reset');
  const trainNameInput = document.getElementById('train-name');
  const speakerSelect = document.getElementById('speaker-select');
  let lastStatus = {
    active: true, voice_enabled: false, training: false,
    training_seconds: 0, training_target_seconds: 0, cloned: false, active_speaker_id: null,
  };

  function applyStatus(status) {
    lastStatus = status;

    toggleBtn.textContent = status.active ? 'Stop' : 'Start';
    toggleBtn.classList.toggle('is-active', status.active);

    voiceBtn.textContent = status.voice_enabled ? '🔊 Voice on' : '🔇 Voice off';
    voiceBtn.classList.toggle('is-active', status.voice_enabled);

    if (status.training) {
      trainBtn.textContent = `Stop training (${status.training_seconds}s / ${status.training_target_seconds}s)`;
    } else {
      trainBtn.textContent = status.cloned ? 'Train voice (cloned ✓)' : 'Train voice';
    }
    trainBtn.classList.toggle('is-active', status.training);

    speakerSelect.value = status.active_speaker_id || '';
  }

  function applyLibrary(msg) {
    const current = speakerSelect.value;
    speakerSelect.innerHTML = '';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '— no cloned voice —';
    speakerSelect.appendChild(noneOpt);
    for (const speaker of msg.speakers) {
      const opt = document.createElement('option');
      opt.value = speaker.id;
      opt.textContent = speaker.name;
      speakerSelect.appendChild(opt);
    }
    speakerSelect.value = lastStatus.active_speaker_id || current || '';
  }

  let ws = null;
  function send(action, extra = {}) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action, ...extra }));
    }
  }

  toggleBtn.addEventListener('click', () => send(lastStatus.active ? 'stop' : 'start'));
  voiceBtn.addEventListener('click', () => send(lastStatus.voice_enabled ? 'voice_off' : 'voice_on'));
  trainBtn.addEventListener('click', () => {
    if (lastStatus.training) {
      send('train_stop');
    } else {
      send('train_start', { name: trainNameInput.value });
    }
  });
  resetBtn.addEventListener('click', () => send('reset'));
  speakerSelect.addEventListener('change', () => send('select_speaker', { speaker_id: speakerSelect.value }));

  function connect() {
    const status = document.getElementById('status');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => { status.textContent = ''; };
    ws.onerror = () => ws.close();
    ws.onclose = () => {
      status.textContent = 'reconnecting…';
      setTimeout(connect, 1000);
    };
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'original') addLine('original-lines', msg.text);
      else if (msg.type === 'translated') addLine('translated-lines', msg.text);
      else if (msg.type === 'verse') showVerse(msg);
      else if (msg.type === 'reset') clearCaptions();
      else if (msg.type === 'status') applyStatus(msg);
      else if (msg.type === 'library') applyLibrary(msg);
    };
  }

  connect();
</script>
</body>
</html>

[project]
name = "sts"
version = "0.1.0"
description = "Live Russian-to-English speech-to-speech pipeline for pulpit audio"
requires-python = ">=3.10,<3.12"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "soxr>=0.3",           # streaming resampler for speech playback (also a librosa dependency)
    "scipy>=1.10",         # capture resampling, audio-quality measures
    "torch>=2.1",
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "scikit-learn>=1.3",   # clustering speakers (translate.py --multiple)
    "onnxruntime>=1.16",   # runs the speaker-embedding model
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# The two TTS backends need incompatible transformers versions (Coqui TTS
# breaks on >=4.50, qwen-tts pins ==4.57.3), so install ONE per virtualenv.
xtts = [
    "TTS>=0.22",
    "transformers>=4.40,<4.50",
]
dev = [
    "pytest>=8.0",
]
qwen3 = [
    "qwen-tts",
    "peft>=0.11",
    "safetensors>=0.4",
]
# Unlike the TTS backends, this doesn't conflict with either one - nemo's own
# transformers requirement is unpinned, so it resolves to whatever xtts/qwen3
# already pinned in that virtualenv. Install alongside whichever TTS extra
# you're already using, e.g. `pip install -e '.[xtts,parakeet]'`.
parakeet = [
    "nemo_toolkit[asr]",
]

# Sber's GigaAM-v3 (Russian-only ASR). Its model code, loaded from the
# Hugging Face repo, is written against these exact torch/transformers
# versions - newer than xtts allows - so it gets its own virtualenv
# (.venv-gigaam). torch 2.8 comes from the CUDA wheel index, e.g.
# `--extra-index-url https://download.pytorch.org/whl/cu126`.
gigaam = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "soundfile>=0.12",
]

[project.scripts]
sts = "sts.cli:main"
sts-import-voice = "sts.tts.import_cli:main"
sts-translate = "sts.offline:main"
sts-benchmark = "sts.benchmark:main"
sts-caption = "sts.caption:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sts.web" = ["static/*"]
"sts.bible.data" = ["*.json.gz"]
"sts.bundled_voices" = ["*/reference.wav", "*/meta.json"]
"sts.assets" = ["*.wav"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sts"
version = "0.1.0"
description = "Live Russian-to-English speech-to-speech pipeline for pulpit audio"
requires-python = ">=3.10,<3.12"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "soxr>=0.3",           # streaming resampler for speech playback (also a librosa dependency)
    "scipy>=1.10",         # capture resampling, audio-quality measures
    "psutil>=5.0",         # listing this machine's addresses for the caption page URLs
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "onnxruntime>=1.16",   # Silero VAD (loaded from torch hub) imports it
    "hydra-core>=1.3",     # GigaAM's model code (speech recognition) is built with it
    "omegaconf>=2.3",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# The TTS extras need incompatible transformers versions (Coqui TTS breaks on
# >=4.50, qwen-tts pins ==4.57.3, mlx-audio needs >=5), so install ONE per
# virtualenv: .venv-xtts, .venv-qwen, .venv-mlx.
xtts = [
    "TTS>=0.22",
    "transformers>=4.40,<4.50",
]
dev = [
    "pytest>=8.0",
]
qwen3 = [
    "qwen-tts",
    "peft>=0.11",
    "safetensors>=0.4",
]
# Qwen3-TTS on Apple's MLX instead of PyTorch (Apple Silicon; about 2.5x faster
# there). mlx-audio needs transformers>=5, qwen-tts pins 4.57.3: a virtualenv of
# its own (.venv-mlx). No trained LoRA voices on this engine. Also has Fish
# Audio Drama 3 (the "drama3" backend, switchable with Qwen3 from the page).
mlx = [
    # mlx-audio from GitHub, pinned: Fish Audio Drama 3 (fish_drama3) isn't in a release yet (0.5.9).
    "mlx-audio @ git+https://github.com/Blaizzy/mlx-audio.git@4ef6c3a577ade12d946e4b1d1870e4ba67fb5b9a",
    "safetensors>=0.4",
    "librosa>=0.10",
]

[project.scripts]
sts = "sts.cli:main"
sts-import-voice = "sts.tts.import_cli:main"
sts-add-voices = "sts.add_voices:main"
sts-benchmark = "sts.benchmark:main"
sts-caption = "sts.caption:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sts.web" = ["static/*"]
"sts.bible.data" = ["*.json.gz"]
"sts.bundled_voices" = ["*/reference.wav", "*/meta.json"]
"sts.assets" = ["*.wav"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

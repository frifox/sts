[project]
name = "sts"
version = "0.1.0"
description = "Live Russian-to-English speech-to-speech pipeline for pulpit audio"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "torch>=2.1",
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "TTS>=0.22",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sts = "sts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sts.web" = ["static/*"]
"sts.bible.data" = ["*.json.gz"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sts"
version = "0.1.0"
description = "Live Russian-to-English speech-to-speech pipeline for pulpit audio"
requires-python = ">=3.10,<3.12"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "torch>=2.1",
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# The two TTS backends need incompatible transformers versions (Coqui TTS
# breaks on >=4.50, qwen-tts pins ==4.57.3), so install ONE per virtualenv.
xtts = [
    "TTS>=0.22",
    "transformers>=4.40,<4.50",
]
dev = [
    "pytest>=8.0",
]
qwen3 = [
    "qwen-tts",
    "peft>=0.11",
    "safetensors>=0.4",
]

[project.scripts]
sts = "sts.cli:main"
sts-import-voice = "sts.tts.import_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sts.web" = ["static/*"]
"sts.bible.data" = ["*.json.gz"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
